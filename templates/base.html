<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinThread | Fashion for Family & Friends</title>
    <meta name="description" content="Premium fashion clothing for family and friends. Join KinThread today.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    {% block content %}
    {% endblock %}

    {% if messages %}
    <script>
        window.backendAlerts = [
            {% for message in messages %}
            {
                "type": "{{ message.tags }}",
                "text": "{{ message|escapejs }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
        ];
    </script>
    {% else %}
    <script>
        window.backendAlerts = [];
    </script>
    {% endif %}

    <script src="{% static 'script.js' %}"></script>
</body>
</html>
